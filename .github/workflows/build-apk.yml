name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev \
            libssl-dev build-essential ccache

      - name: Download Chinese font
        run: |
          curl -L --retry 3 -o font.ttf \
            https://raw.githubusercontent.com/StellarCN/scp_zh/master/fonts/SimHei.ttf
          ls -la font.ttf

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Build APK
        run: |
          yes | buildozer -v android debug

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: gwhb-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Publish APK to Release (public download link)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 港湾汉堡 App v1.0.${{ github.run_number }}
          files: bin/*.apk
          draft: false
